services:
  # ToolVision AI — FastAPI Backend Service
  - type: web
    name: toolvision-backend
    runtime: python
    plan: free
    region: oregon
    autoDeploy: true
    branch: main
    buildCommand: "pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: "."
